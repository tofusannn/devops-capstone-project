---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove old files from the shared workspace.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        WORKSPACE_SOURCE_PATH="$(workspaces.source.path)"
        if [ -d "${WORKSPACE_SOURCE_PATH}" ]; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-accounts
spec:
  description: Apply Kubernetes manifests and update the container image.
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: rollout
      image: bitnami/kubectl:1.28
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        kubectl apply -f deploy/deployment.yaml -f deploy/service.yaml
        kubectl set image deployment/accounts accounts="$(params.image)"
        kubectl rollout status deployment/accounts --timeout=180s
        kubectl get deployment,pods,replicasets,services -l app=accounts
