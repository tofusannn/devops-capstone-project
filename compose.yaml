# Local development only. Do not expose these training credentials publicly.
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - capstone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The app initializes tables on import; use one local worker to avoid a concurrent CREATE TABLE race.
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1", "service:app"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URI: postgresql://postgres:postgres@db:5432/postgres
      FORCE_HTTPS: "false"
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  capstone_pgdata:
